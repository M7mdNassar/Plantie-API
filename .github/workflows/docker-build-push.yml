name: Build and deploy

on:
  push:
    branches: [main, dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plantie-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/plantie-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only prod redeploys from main
      - name: Trigger Render PROD deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"

      # Only dev redeploys from dev
      - name: Trigger Render DEV deploy
        if: github.ref == 'refs/heads/dev'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: curl -fsS -X POST "$HOOK"